<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thiết kế Slideshow bằng jQuery</title>
  <style>
    body {
      margin: 0px auto;
      width: 1000px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding-bottom: 40px;
    }

    h1 {
      text-align: center;
      margin: 24px 0 18px;
      font-size: 26px;
    }

    .main-viewer {
      position: relative;
      width: 1000px;
      height: 560px;
      background: #0f172a;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.15);
    }

    .main-viewer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.65);
      color: #ffffff;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease;
      z-index: 10;
    }

    .nav-btn:hover {
      background: rgba(2, 132, 199, 0.9);
    }

    #btnLeft {
      left: 16px;
    }

    #btnRight {
      right: 16px;
    }

    .slideshow {
      width: 1000px;
      overflow: hidden;
      background: #ffffff;
      padding: 12px 0;
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    }

    .slideshow_inner {
      margin-left: 10px;
      width: 1000px;
      display: flex;
      gap: 12px;
    }

    .slideshow_inner a {
      display: block;
      width: 186px;
      height: 110px;
      border-radius: 6px;
      overflow: hidden;
      border: 3px solid transparent;
      opacity: 0.7;
      transition: opacity 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .slideshow_inner a:hover,
    .slideshow_inner a.active {
      opacity: 1;
      border-color: #0284c7;
      transform: translateY(-2px);
    }

    .slideshow_inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>

  <h1>Slideshow Porsche 718 (jQuery)</h1>

  <div class="main-viewer">
    <button type="button" id="btnLeft" class="nav-btn" title="Ảnh trước">&#10094;</button>
    <img id="mainImage" src="slideshow/porsche718_1.jpg" alt="Porsche 718" />
    <button type="button" id="btnRight" class="nav-btn" title="Ảnh tiếp theo">&#10095;</button>
  </div>

  <div class="slideshow">
    <div class="slideshow_inner">
      <a href="slideshow/porsche718_1.jpg" class="active">
        <img src="slideshow/porsche718_1.jpg" alt="Porsche 718 - 1" />
      </a>
      <a href="slideshow/porsche718_2.jpg">
        <img src="slideshow/porsche718_2.jpg" alt="Porsche 718 - 2" />
      </a>
      <a href="slideshow/porsche718_3.jpg">
        <img src="slideshow/porsche718_3.jpg" alt="Porsche 718 - 3" />
      </a>
      <a href="slideshow/porsche718_4.jpg">
        <img src="slideshow/porsche718_4.jpg" alt="Porsche 718 - 4" />
      </a>
      <a href="slideshow/porsche718_5.jpg">
        <img src="slideshow/porsche718_5.jpg" alt="Porsche 718 - 5" />
      </a>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    $(function () {
      const $thumbs = $(".slideshow_inner a");
      const $mainImage = $("#mainImage");
      let currentIndex = 0;

      function showSlide(index) {
        if (index < 0) index = $thumbs.length - 1;
        if (index >= $thumbs.length) index = 0;
        currentIndex = index;

        const $targetThumb = $thumbs.eq(currentIndex);
        const bigSrc = $targetThumb.attr("href");

        $thumbs.removeClass("active");
        $targetThumb.addClass("active");

        $mainImage.stop(true, true).fadeOut(150, function () {
          $(this).attr("src", bigSrc).fadeIn(200);
        });
      }

      $thumbs.on("click", function (e) {
        e.preventDefault();
        const clickedIndex = $thumbs.index(this);
        showSlide(clickedIndex);
      });

      $("#btnLeft").on("click", function () {
        showSlide(currentIndex - 1);
      });

      $("#btnRight").on("click", function () {
        showSlide(currentIndex + 1);
      });
    });
  </script>
</body>
</html>
