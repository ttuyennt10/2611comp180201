<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kiểm tra năm nhuận bằng JavaScript</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    h1 {
      font-size: 20px;
      margin-bottom: 16px;
      text-align: center;
    }

    .form-group {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 10px 12px;
      font-size: 15px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
    }

    input:focus {
      border-color: #0284c7;
    }

    button {
      padding: 10px 16px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background: #0284c7;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #0369a1;
    }

    #result {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14.5px;
      display: none;
    }

    .leap {
      display: block !important;
      background: #dcfce7;
      color: #166534;
    }

    .not-leap {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Kiểm tra năm nhuận</h1>
    <form id="leapForm" class="form-group">
      <input type="number" id="yearInput" placeholder="Nhập năm (vd: 2024)" required />
      <button type="submit">Kiểm tra</button>
    </form>
    <div id="result"></div>
  </div>

  <script>
    function isLeapYear(year) {
      return (year % 400 === 0) || (year % 4 === 0 && year % 100 !== 0);
    }

    const form = document.getElementById("leapForm");
    const yearInput = document.getElementById("yearInput");
    const resultEl = document.getElementById("result");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const year = parseInt(yearInput.value, 10);

      resultEl.className = "";
      if (!Number.isInteger(year) || year <= 0) {
        resultEl.textContent = "Vui lòng nhập một số năm hợp lệ lớn hơn 0.";
        resultEl.classList.add("not-leap");
        return;
      }

      if (isLeapYear(year)) {
        resultEl.textContent = `Năm ${year} là năm nhuận (tháng 2 có 29 ngày).`;
        resultEl.classList.add("leap");
      } else {
        resultEl.textContent = `Năm ${year} không phải là năm nhuận (tháng 2 có 28 ngày).`;
        resultEl.classList.add("not-leap");
      }
    });
  </script>
</body>
</html>
