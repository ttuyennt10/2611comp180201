<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng ký thành viên</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #f1f5f9 100%);
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .register-card {
      width: 100%;
      max-width: 500px;
      background: #ffffff;
      padding: 36px 32px;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
      border: 1px solid #e2e8f0;
    }

    .form-header {
      text-align: center;
      margin-bottom: 26px;
    }

    .form-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .form-header p {
      font-size: 14px;
      color: #64748b;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    label .required {
      color: #ef4444;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="tel"],
    input[type="date"],
    select {
      width: 100%;
      padding: 10px 13px;
      font-size: 14px;
      color: #0f172a;
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 9px;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus,
    select:focus {
      background: #ffffff;
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.14);
    }

    .gender-group {
      display: flex;
      gap: 18px;
      padding-top: 6px;
    }

    .radio-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 400;
      font-size: 14px;
      color: #334155;
      cursor: pointer;
    }

    .radio-label input[type="radio"],
    .checkbox-label input[type="checkbox"] {
      accent-color: #0284c7;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .terms-group {
      margin: 18px 0 22px;
    }

    .checkbox-label {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 400;
      color: #475569;
      line-height: 1.45;
      cursor: pointer;
    }

    .checkbox-label a {
      color: #0284c7;
      text-decoration: none;
      font-weight: 600;
    }

    .checkbox-label a:hover {
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background: #0284c7;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn-submit:hover {
      background: #0369a1;
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .form-footer {
      text-align: center;
      margin-top: 18px;
      font-size: 13.5px;
      color: #64748b;
    }

    .form-footer a {
      color: #0284c7;
      font-weight: 600;
      text-decoration: none;
    }

    .form-footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .form-row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .register-card {
        padding: 28px 20px;
      }
    }
  </style>
</head>
<body>

  <main class="register-card">
    <div class="form-header">
      <h1>Đăng ký thành viên</h1>
      <p>Tạo tài khoản mới để tham gia hệ thống</p>
    </div>

    <form action="#" method="post">
      <div class="form-row">
        <div class="form-group">
          <label for="fullname">Họ và tên <span class="required">*</span></label>
          <input type="text" id="fullname" name="fullname" placeholder="Nguyễn Văn A" required />
        </div>

        <div class="form-group">
          <label for="username">Tên đăng nhập <span class="required">*</span></label>
          <input type="text" id="username" name="username" placeholder="nguyenvana" required />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="email">Email <span class="required">*</span></label>
          <input type="email" id="email" name="email" placeholder="example@gmail.com" required />
        </div>

        <div class="form-group">
          <label for="phone">Số điện thoại</label>
          <input type="tel" id="phone" name="phone" placeholder="0901 234 567" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">Mật khẩu <span class="required">*</span></label>
          <input type="password" id="password" name="password" placeholder="Tối thiểu 6 ký tự" minlength="6" required />
        </div>

        <div class="form-group">
          <label for="confirm-password">Nhập lại mật khẩu <span class="required">*</span></label>
          <input type="password" id="confirm-password" name="confirm-password" placeholder="Xác nhận mật khẩu" minlength="6" required />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="dob">Ngày sinh</label>
          <input type="date" id="dob" name="dob" />
        </div>

        <div class="form-group">
          <label>Giới tính</label>
          <div class="gender-group">
            <label class="radio-label">
              <input type="radio" name="gender" value="nam" checked /> Nam
            </label>
            <label class="radio-label">
              <input type="radio" name="gender" value="nu" /> Nữ
            </label>
            <label class="radio-label">
              <input type="radio" name="gender" value="khac" /> Khác
            </label>
          </div>
        </div>
      </div>

      <div class="terms-group">
        <label class="checkbox-label">
          <input type="checkbox" required />
          <span>Tôi đồng ý với <a href="#">Điều khoản dịch vụ</a> và <a href="#">Chính sách bảo mật</a>.</span>
        </label>
      </div>

      <button type="submit" class="btn-submit">Đăng ký ngay</button>
    </form>

    <div class="form-footer">
      Đã có tài khoản? <a href="#">Đăng nhập</a>
    </div>
  </main>

</body>
</html>
