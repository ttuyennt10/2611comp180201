<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập bằng jQuery</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #f1f5f9 100%);
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      padding: 36px 32px;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
      border: 1px solid #e2e8f0;
    }

    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .login-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .login-header p {
      font-size: 14px;
      color: #64748b;
    }

    .alert-box {
      display: none;
      padding: 11px 14px;
      border-radius: 9px;
      font-size: 13.5px;
      margin-bottom: 16px;
      line-height: 1.45;
    }

    .alert-error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .alert-success {
      background: #f0fdf4;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      font-size: 14.5px;
      color: #0f172a;
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 9px;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    input.has-toggle {
      padding-right: 68px;
    }

    input:focus {
      background: #ffffff;
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.14);
    }

    input.input-error {
      border-color: #ef4444;
      background: #fffafa;
    }

    .toggle-pass-btn {
      position: absolute;
      right: 10px;
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
    }

    .toggle-pass-btn:hover {
      color: #0284c7;
      background: #f0f9ff;
    }

    .field-error {
      display: none;
      font-size: 12.5px;
      color: #dc2626;
      margin-top: 5px;
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 14px 0 22px;
      font-size: 13.5px;
    }

    .remember-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #475569;
      font-weight: 400;
      cursor: pointer;
    }

    .remember-label input[type="checkbox"] {
      accent-color: #0284c7;
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    .forgot-link {
      color: #0284c7;
      text-decoration: none;
      font-weight: 500;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background: #0284c7;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease, opacity 0.2s ease;
    }

    .btn-login:hover:not(:disabled) {
      background: #0369a1;
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13.5px;
      color: #64748b;
    }

    .login-footer a {
      color: #0284c7;
      font-weight: 600;
      text-decoration: none;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <main class="login-card">
    <div class="login-header">
      <h1>Đăng nhập</h1>
      <p>Chào mừng bạn quay trở lại hệ thống</p>
    </div>

    <div id="alertBox" class="alert-box" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="account">Tên đăng nhập hoặc Email</label>
        <input
          type="text"
          id="account"
          name="account"
          placeholder="Nhập tên đăng nhập hoặc email"
          autocomplete="username"
        />
        <div id="accountError" class="field-error">Vui lòng nhập tên đăng nhập hoặc email.</div>
      </div>

      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <div class="input-wrap">
          <input
            type="password"
            id="password"
            name="password"
            class="has-toggle"
            placeholder="Nhập mật khẩu"
            autocomplete="current-password"
          />
          <button type="button" id="togglePassword" class="toggle-pass-btn">Hiện</button>
        </div>
        <div id="passwordError" class="field-error">Vui lòng nhập mật khẩu (tối thiểu 6 ký tự).</div>
      </div>

      <div class="form-options">
        <label class="remember-label">
          <input type="checkbox" id="rememberMe" />
          <span>Ghi nhớ đăng nhập</span>
        </label>
        <a href="#quen-mat-khau" class="forgot-link" id="forgotLink">Quên mật khẩu?</a>
      </div>

      <button type="submit" id="submitBtn" class="btn-login">Đăng nhập</button>
    </form>

    <div class="login-footer">
      Chưa có tài khoản? <a href="#dang-ky">Đăng ký ngay</a>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    $(function () {
      const $form = $("#loginForm");
      const $account = $("#account");
      const $password = $("#password");
      const $alertBox = $("#alertBox");
      const $submitBtn = $("#submitBtn");

      function showAlert(type, message) {
        $alertBox
          .removeClass("alert-error alert-success")
          .addClass(type === "error" ? "alert-error" : "alert-success")
          .text(message)
          .stop(true, true)
          .slideDown(180);
      }

      function hideAlert() {
        $alertBox.stop(true, true).slideUp(150);
      }

      function setFieldError($input, $errorEl, hasError, customMsg) {
        if (hasError) {
          $input.addClass("input-error");
          if (customMsg) $errorEl.text(customMsg);
          $errorEl.stop(true, true).slideDown(150);
        } else {
          $input.removeClass("input-error");
          $errorEl.stop(true, true).slideUp(150);
        }
      }

      // Ẩn / hiện mật khẩu
      $("#togglePassword").on("click", function () {
        const isPassword = $password.attr("type") === "password";
        $password.attr("type", isPassword ? "text" : "password");
        $(this).text(isPassword ? "Ẩn" : "Hiện");
      });

      // Xóa lỗi khi người dùng gõ lại
      $account.on("input", function () {
        setFieldError($account, $("#accountError"), false);
        hideAlert();
      });

      $password.on("input", function () {
        setFieldError($password, $("#passwordError"), false);
        hideAlert();
      });

      // Xử lý gửi form
      $form.on("submit", function (e) {
        e.preventDefault();

        const accountVal = $.trim($account.val());
        const passwordVal = $password.val();
        let isValid = true;

        if (!accountVal) {
          setFieldError($account, $("#accountError"), true, "Vui lòng nhập tên đăng nhập hoặc email.");
          isValid = false;
        } else {
          setFieldError($account, $("#accountError"), false);
        }

        if (!passwordVal) {
          setFieldError($password, $("#passwordError"), true, "Vui lòng nhập mật khẩu.");
          isValid = false;
        } else if (passwordVal.length < 6) {
          setFieldError($password, $("#passwordError"), true, "Mật khẩu phải có ít nhất 6 ký tự.");
          isValid = false;
        } else {
          setFieldError($password, $("#passwordError"), false);
        }

        if (!isValid) {
          showAlert("error", "Vui lòng kiểm tra lại thông tin đăng nhập.");
          return;
        }

        // Mô phỏng gửi yêu cầu đăng nhập
        $submitBtn.prop("disabled", true).text("Đang đăng nhập...");
        hideAlert();

        setTimeout(function () {
          $submitBtn.prop("disabled", false).text("Đăng nhập");
          const savedNote = $("#rememberMe").is(":checked") ? " (đã chọn ghi nhớ phiên)" : "";
          showAlert("success", `Đăng nhập thành công với tài khoản "${accountVal}"${savedNote}!`);
        }, 700);
      });

      // Thông báo minh họa khi bấm quên mật khẩu
      $("#forgotLink").on("click", function (e) {
        e.preventDefault();
        showAlert("success", "Tính năng khôi phục mật khẩu đang được mở rộng cho bài thực hành.");
      });
    });
  </script>
</body>
</html>
